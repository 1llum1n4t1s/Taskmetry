name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 自己完結ビルド
    runs-on: windows-2022
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: .NET SDK をセットアップ
        # actions/setup-dotnet@v6.0.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: lock file を検証して復元
        run: dotnet restore src/Taskmetry/Taskmetry.csproj -r win-x64 --locked-mode

      - name: 自己完結ビルド用に RuntimeIdentifier 指定で追加復元
        # slnx全体のrestoreだけではRID固有のランタイムパックが復元されないため(NETSDK1112)、
        # 公開対象プロジェクトだけを対象にRID指定で追加restoreする。
        run: dotnet restore src/Taskmetry/Taskmetry.csproj --locked-mode -r win-x64

      - name: 自己完結版を公開
        run: dotnet publish src/Taskmetry/Taskmetry.csproj -c Release -r win-x64 --self-contained --no-restore -o publish

      - name: 成果物を確認
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'publish/Taskmetry.exe')) {
            throw 'publish/Taskmetry.exe が見つかりません。'
          }

      - name: 未署名の検証用成果物をアップロード
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: taskmetry-win-x64-unsigned
          path: publish/**
          retention-days: 7
