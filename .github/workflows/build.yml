name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 自己完結ビルド
    runs-on: windows-2022
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select SDK compatible with the locked compiler packs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = if (Test-Path -LiteralPath 'global.json') { Get-Content -LiteralPath 'global.json' -Raw | ConvertFrom-Json -AsHashtable } else { @{} }
          if (-not $config.ContainsKey('sdk')) { $config['sdk'] = @{} }
          $config['sdk']['version'] = '10.0.401'
          $config['sdk']['rollForward'] = 'disable'
          $config | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath 'global.json' -Encoding utf8
      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - name: lock file を検証して復元
        run: dotnet restore src/Taskmetry/Taskmetry.csproj -r win-x64 --locked-mode
      - name: 自己完結ビルド用に RuntimeIdentifier 指定で追加復元
        run: dotnet restore src/Taskmetry/Taskmetry.csproj --locked-mode -r win-x64
      - name: 自己完結版を公開
        run: dotnet publish src/Taskmetry/Taskmetry.csproj -c Release -r win-x64 --self-contained --no-restore -o publish
      - name: 成果物を確認
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'publish/Taskmetry.exe')) {
            throw 'publish/Taskmetry.exe が見つかりません。'
          }
      - name: 未署名の検証用成果物をアップロード
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: taskmetry-win-x64-unsigned
          path: publish/**
          retention-days: 7
