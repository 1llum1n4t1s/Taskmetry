name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: windows-2022
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: .NET SDK をセットアップ
        # actions/setup-dotnet@v6.0.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: lock file を検証して復元
        run: dotnet restore Taskmetry.slnx --locked-mode

      - name: Release ビルド
        run: dotnet build Taskmetry.slnx -c Release --no-restore

      - name: テスト
        run: dotnet test src/Taskmetry.Tests/Taskmetry.Tests.csproj -c Release --no-build --logger "trx;LogFileName=taskmetry-tests.trx" --results-directory TestResults

      - name: テスト結果をアップロード
        if: always()
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: taskmetry-test-results
          path: TestResults/**
          if-no-files-found: ignore
          retention-days: 7

  build:
    uses: ./.github/workflows/build.yml

