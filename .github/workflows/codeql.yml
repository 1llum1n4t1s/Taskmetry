name: CodeQL 解析

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: C# CodeQL 解析
    runs-on: windows-2022
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select SDK compatible with the locked compiler packs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = if (Test-Path -LiteralPath 'global.json') { Get-Content -LiteralPath 'global.json' -Raw | ConvertFrom-Json -AsHashtable } else { @{} }
          if (-not $config.ContainsKey('sdk')) { $config['sdk'] = @{} }
          $config['sdk']['version'] = '10.0.401'
          $config['sdk']['rollForward'] = 'disable'
          $config | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath 'global.json' -Encoding utf8
      - name: .NET SDK をセットアップ
        # actions/setup-dotnet@v6.0.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.401'

      - name: CodeQL を初期化
        # github/codeql-action/init@v4.38.2
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: csharp
          build-mode: manual

      - name: ビルド
        run: dotnet build Taskmetry.slnx -c Release

      - name: CodeQL 解析を実行
        # github/codeql-action/analyze@v4.38.2
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          category: /language:csharp
