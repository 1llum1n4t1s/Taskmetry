name: CodeQL 解析

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: C# CodeQL 解析
    runs-on: windows-2022
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: .NET SDK をセットアップ
        # actions/setup-dotnet@v6.0.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: CodeQL を初期化
        # github/codeql-action/init@v4.37.6
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: csharp
          build-mode: manual

      - name: ビルド
        run: dotnet build Taskmetry.slnx -c Release

      - name: CodeQL 解析を実行
        # github/codeql-action/analyze@v4.37.6
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          category: /language:csharp

